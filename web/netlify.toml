# Dedicated peso-marketing project. Set package directory to web in Netlify UI.
# Base is the repository root; all contexts inherit this marketing-only command.
[build]
  base = "."
  command = "npm --prefix web ci && npm run web:build:marketing && npm run web:verify:marketing"
  publish = "dist"

[[redirects]]
  from = "/demo/peso-demo-video.gif"
  to = "/demo/peso-pose-overlay.jpg"
  status = 301
  force = true

[[headers]]
  for = "/marketing-assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/demo/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'none'; worker-src 'self' blob:; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
