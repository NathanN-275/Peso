name: Verify and publish Student candidate

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-staging-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/nathann-275/peso-backend

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend policy tests
        run: npm run test:policy

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Install backend dependencies
        working-directory: backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch verified pose models
        run: python scripts/fetch_pose_models.py

      - name: Audit Node dependencies
        run: npm run audit:ci

      - name: Run backend tests
        working-directory: backend
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role
          SUPABASE_JWT_SECRET: test-jwt-secret
          CLEANUP_JOB_TOKEN: test-cleanup-token
          BACKEND_ALLOW_UNAUTHENTICATED_DEV_CLEANUP: "false"
        run: python -m unittest discover -s tests

      - name: Build and lint Azure Bicep
        run: |
          az bicep install --version v0.46.1
          az bicep build --file infra/azure/student.bicep --stdout > /dev/null

  publish:
    name: Publish immutable backend image
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.registry.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate without publishing
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          pull: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bind release candidate to its local image identity
        id: candidate
        run: |
          set -euo pipefail
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}")"
          echo "image_id=${IMAGE_ID}" >> "${GITHUB_OUTPUT}"

      - name: Verify offline non-root runtime
        run: ./scripts/verify_container_runtime.sh "${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}"

      - name: Block high and critical findings before publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          format: json
          output: trivy-results.json
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: false

      - name: Refuse candidate tag drift after verification
        env:
          EXPECTED_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
        run: test "$(docker image inspect --format '{{.Id}}' "${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}")" = "${EXPECTED_IMAGE_ID}"

      - name: Publish and bind the exact scanned image
        id: registry
        env:
          EXPECTED_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}"
          docker push "${IMAGE_TAG}" 2>&1 | tee docker-push.txt
          REGISTRY_DIGEST="$(sed -nE 's/^.*digest: (sha256:[a-f0-9]{64}).*$/\1/p' docker-push.txt | tail -1)"
          test "${REGISTRY_DIGEST#sha256:}" != "${REGISTRY_DIGEST}"
          test "${#REGISTRY_DIGEST}" -eq 71
          IMMUTABLE_REFERENCE="${IMAGE_REPOSITORY}@${REGISTRY_DIGEST}"
          docker pull "${IMMUTABLE_REFERENCE}" >/dev/null
          test "$(docker image inspect --format '{{.Id}}' "${IMMUTABLE_REFERENCE}")" = "${EXPECTED_IMAGE_ID}"
          echo "digest=${REGISTRY_DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Record exact-image release evidence
        env:
          IMAGE_DIGEST: ${{ steps.registry.outputs.digest }}
          IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          jq --arg commit "${GITHUB_SHA}" \
            --arg repository "${IMAGE_REPOSITORY}" \
            --arg tag "${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg image_id "${IMAGE_ID}" '
              {
                source_commit: $commit,
                image_tag: $tag,
                image_digest: $digest,
                immutable_image_reference: ($repository + "@" + $digest),
                local_image_id: $image_id,
                offline_uid_10001_runtime_check: "passed",
                trivy: {
                  version: "v0.74.0",
                  severity: ["HIGH", "CRITICAL"],
                  ignore_unfixed: false,
                  finding_count: ([((.Results // [])[]?.Vulnerabilities // [])[]?] | length),
                  result: "passed"
                }
              }
            ' trivy-results.json > release-evidence/image-security.json
          test "$(jq -r '.trivy.finding_count' release-evidence/image-security.json)" = "0"
          jq -r '"Exact image `\(.immutable_image_reference)` passed the offline UID-10001 runtime check and strict Trivy HIGH/CRITICAL scan (unfixed included)."' \
            release-evidence/image-security.json >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload image security release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: student-image-security-${{ github.sha }}
          path: |
            release-evidence/image-security.json
            trivy-results.json
          if-no-files-found: error
          retention-days: 90
