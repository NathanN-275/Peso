name: Security Checks

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - production

jobs:
  production-release-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Require production releases from this repository's main branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HEAD_BRANCH" != "main" ] || [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            echo "Production releases must come from the main branch in $REPOSITORY."
            exit 1
          fi

  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run backend tests
        working-directory: backend
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role
          SUPABASE_JWT_SECRET: test-jwt-secret
          CLEANUP_JOB_TOKEN: test-cleanup-token
          BACKEND_ALLOW_UNAUTHENTICATED_DEV_CLEANUP: "false"
        run: python -m unittest discover -s tests

      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1805

      - name: Audit Supabase migrations and RLS
        run: python scripts/supabase_security_audit.py

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend policy tests
        run: npm run test:policy

      - name: Audit Node dependencies
        run: npm run audit:ci

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reservation-database-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: peso_security_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-security-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'psycopg[binary]==3.2.6'
      - name: Exercise migration, concurrent quotas, expiry, queue admission, and RLS
        working-directory: backend
        env:
          SECURITY_TEST_DATABASE_URL: postgresql://postgres:local-security-test-only@127.0.0.1:5432/peso_security_test
        run: python -m unittest discover -s tests -p test_upload_reservations_postgres.py -v

  container-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build candidate backend image without publishing it
        run: docker build --tag peso-backend:security-check .
      - name: Block high and critical container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: peso-backend:security-check
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: false
