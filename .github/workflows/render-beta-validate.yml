name: Render Beta Release Validation

on:
  pull_request:
    paths:
      - render-beta.yaml
      - render-public-beta.yaml
      - Dockerfile
      - backend/**
      - scripts/**
      - supabase/migrations/**
      - .github/workflows/render-beta-validate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-beta-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate beta Blueprint and runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install frontend and backend dependencies
        run: |
          npm ci
          python -m pip install --requirement backend/requirements.txt

      - name: Install and verify backend media tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install pinned Render CLI
        env:
          RENDER_CLI_VERSION: 2.28.0
          RENDER_CLI_SHA256: 00d1ca6f3c31b1f4bc7316837b8ee24acbeb11cf372b7593c7d2c3106a1987b4
        run: |
          set -euo pipefail
          archive="cli_${RENDER_CLI_VERSION}_linux_amd64.zip"
          curl --fail --silent --show-error --location \
            "https://github.com/render-oss/cli/releases/download/v${RENDER_CLI_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "${RENDER_CLI_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/render-cli"
          render_binary="$(find "$RUNNER_TEMP/render-cli" -type f -name 'cli_v*' -print -quit)"
          test -n "$render_binary"
          install "$render_binary" "$RUNNER_TEMP/render"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/render" --version | grep "${RENDER_CLI_VERSION}"

      - name: Validate Render beta Blueprint
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WORKSPACE_ID: ${{ vars.RENDER_WORKSPACE_ID }}
        run: |
          : "${RENDER_API_KEY:?Configure a Render API key as a protected repository secret.}"
          : "${RENDER_WORKSPACE_ID:?Configure the non-production Render workspace ID as a repository variable.}"
          render blueprints validate render-beta.yaml --workspace "$RENDER_WORKSPACE_ID"
          render blueprints validate render-public-beta.yaml --workspace "$RENDER_WORKSPACE_ID"

      - name: Run policy and release-environment tests
        run: npm run test:policy

      - name: Run application typecheck
        run: npm run typecheck

      - name: Run backend tests
        working-directory: backend
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: release-test-service-role
          CLEANUP_JOB_TOKEN: release-test-cleanup-token
          BACKEND_ALLOW_UNAUTHENTICATED_DEV_CLEANUP: "false"
        run: python -m unittest discover -s tests

      - name: Build beta container from the root Dockerfile
        run: docker build --pull --tag peso-render-beta:${{ github.sha }} .

      - name: Run offline Docker runtime checks
        run: ./scripts/verify_container_runtime.sh peso-render-beta:${{ github.sha }}

  migration-preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Check peso-staging migration history and dry run
    needs: validate
    runs-on: ubuntu-latest
    environment: student
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: ${{ vars.SUPABASE_CLI_VERSION }}

      - name: Compare migration history and preview every pending migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence/render-beta-migrations
          node scripts/student-environment.js --database-only
          NO_COLOR=1 supabase migration list --db-url "$SUPABASE_DB_URL" 2>&1 | tee release-evidence/render-beta-migrations/list.txt
          NO_COLOR=1 supabase db push --db-url "$SUPABASE_DB_URL" --dry-run 2>&1 | tee release-evidence/render-beta-migrations/plan.txt
          (cd release-evidence/render-beta-migrations && sha256sum list.txt plan.txt > SHA256SUMS)

      - name: Upload Render beta migration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-beta-migration-plan-${{ github.run_id }}
          path: release-evidence/render-beta-migrations
          if-no-files-found: error
          retention-days: 30
