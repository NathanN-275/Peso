name: Public Beta Geography Refresh

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-beta-geography-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.PESO_PUBLIC_BETA_GEO_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: public-beta-geography
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'psycopg[binary]==3.2.6'
      - name: Validate the monthly source and atomically replace US ranges
        id: geography_refresh
        env:
          PESO_GEO_DATABASE_URL: ${{ secrets.PESO_GEO_DATABASE_URL }}
        run: python scripts/refresh_us_ip_dataset.py --apply --manifest artifacts/us-ip-refresh/manifest.json
      - name: Retain sanitized refresh identity and outcome evidence
        if: ${{ always() && !cancelled() && (steps.geography_refresh.outcome == 'success' || steps.geography_refresh.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-beta-geography-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/us-ip-refresh/
          if-no-files-found: error
          retention-days: 90
