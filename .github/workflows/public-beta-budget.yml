name: Public Beta Budget Guardrail

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-beta-budget-guardrail
  cancel-in-progress: false

jobs:
  monitor:
    if: vars.PESO_PUBLIC_BETA_BUDGET_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: public-beta-budget
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check combined calendar-month spend and enforce intake stop
        env:
          PESO_RENDER_BILLING_JSON: ${{ secrets.PESO_RENDER_BILLING_JSON }}
          PESO_SUPABASE_BILLING_JSON: ${{ secrets.PESO_SUPABASE_BILLING_JSON }}
          PESO_NETLIFY_BILLING_JSON: ${{ secrets.PESO_NETLIFY_BILLING_JSON }}
          PESO_BUDGET_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PESO_BUDGET_SUPABASE_SERVICE_ROLE_KEY }}
          PESO_BUDGET_EMAIL_ADDRESS: ${{ secrets.PESO_BUDGET_EMAIL_ADDRESS }}
          PESO_BUDGET_GMAIL_APP_PASSWORD: ${{ secrets.PESO_BUDGET_GMAIL_APP_PASSWORD }}
        run: python scripts/run_public_beta_budget_monitor.py
