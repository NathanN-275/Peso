[build]
  command = "npm --prefix web ci && npm run web:build:release"
  ignore = "node scripts/netlify-ignore-build.js"
  publish = "dist"

# Only the private main branch test deploy uses the isolated Render beta.
# Its public Supabase key remains branch-specific in Netlify. The backend URL is
# fixed here and must also match the reviewed tracked release binding.
[context.main.environment]
  PESO_RELEASE_ENV = "render-beta"
  EXPO_PUBLIC_SUPABASE_URL = "https://iseqgaewjpjcxrndibep.supabase.co"
  EXPO_PUBLIC_PRODUCTION_BACKEND_URL = "https://peso-beta-api.onrender.com"

[[redirects]]
  from = "/demo/peso-demo-video.gif"
  to = "/demo/peso-pose-overlay.jpg"
  status = 301
  force = true

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[headers]]
  for = "/marketing-assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/demo/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/app/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
